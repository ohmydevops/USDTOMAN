<html lang="fa" dir="rtl">
  <head>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "USD / Toman",
        "alternateName": "قیمت سالانه دلار در ایران",
        "url": "https://ohmydevops.github.io/USDTOMAN/",
        "description": "Yearly US dollar price ranges in Iran, in toman, with government names.",
        "inLanguage": ["fa", "en"]
      }
    </script>
    <link
      rel="preload"
      href="fonts/vazirmatn.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="style.css" />
    <script defer src="app.js"></script>
    <script defer src="alpine.min.js"></script>
  </head>
  <body class="bg-page text-ink antialiased">
    <main
      x-data="dollarTable"
      @resize.window="ensureDesktopSeries(window.innerWidth)"
      class="mx-auto flex h-dvh flex-col overflow-hidden px-3 py-4 sm:px-7 sm:py-6"
      :class="series==='all'?'max-w-[1440px]':'max-w-[1040px]'"
    >
      <header class="mb-5 flex shrink-0 items-center justify-between gap-4">
        <h1 class="text-lg font-semibold sm:text-2xl">
          <a
            href="./"
            class="transition-colors hover:text-accent"
            x-text="t.title"
            >قیمت سالانه دلار در ایران</a
          >
        </h1>
        <nav class="flex shrink-0 gap-1.5" aria-label="Preferences">
          <button type="button" class="icon-button" @click="showExplorer()" :aria-label="t.explorer" :title="t.explorer" aria-haspopup="dialog" aria-controls="explorerDialog">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true" class="theme-icon"><path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5Z"/><path d="M20 2v4m-2-2h4"/></svg>
          </button>
          <button
            class="icon-button text-[10px] font-semibold leading-none"
            @click="toggleLanguage"
            :aria-label="lang==='fa'?'English':'فارسی'"
            :title="lang==='fa'?'English':'فارسی'"
            x-text="lang==='fa'?'EN':'FA'"
          ></button
          ><button
            class="icon-button"
            @click="toggleTheme"
            :aria-label="theme==='dark'?t.light:t.dark"
            :title="theme==='dark'?t.light:t.dark"
            :aria-pressed="theme==='dark'"
          >
            <svg
              class="theme-icon"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <path
                :d="theme==='dark'?'M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0 M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5':'M20 15.2A8.4 8.4 0 0 1 8.8 4a8.4 8.4 0 1 0 11.2 11.2Z'"
                d="M20 15.2A8.4 8.4 0 0 1 8.8 4a8.4 8.4 0 1 0 11.2 11.2Z"
              />
            </svg>
          </button>
        </nav>
      </header>
      <p
        class="mb-3 shrink-0 text-[11px] text-muted"
        x-show="data"
        x-text="data?t.coverage+' '+formatDate(data.latestDate)+' ('+daysAgo(data.latestDate)+')':''"
      ></p>
      <div
        class="mb-2 grid shrink-0 grid-cols-4 gap-1 rounded-lg border border-line bg-surface p-1 sm:inline-flex sm:self-start"
        role="group"
        :aria-label="t.series"
      >
        <template x-for="option in seriesOptions" :key="option.key"
          ><button
            type="button"
            class="series-option rounded-md px-1.5 py-1.5 text-center text-[11px] font-medium leading-4 transition-colors sm:px-3 sm:text-xs"
            :class="(series===option.key?'bg-tint text-accent':'text-muted hover:text-ink') + (option.key==='all'?' hidden lg:block':'')"
            :aria-pressed="series===option.key"
            @click="setSeries(option.key)"
            x-text="option.label"
          ></button
        ></template>
      </div>
      <p
        class="mb-3 shrink-0 text-[10px] leading-4 text-muted"
        x-show="seriesNote"
        x-text="seriesNote"
      ></p>
      <div
        class="table-scroll min-h-0 flex-1 overflow-x-hidden overflow-y-auto overscroll-contain rounded-xl border border-line bg-surface"
        tabindex="0"
        :aria-label="lang==='fa'?'جدول قیمت سالانه دلار':'Yearly dollar prices table'"
      >
        <table x-show="series==='all'" class="all-data-table hidden w-full table-fixed border-collapse text-xs lg:table">
          <thead class="sticky top-0 z-10 bg-tint text-muted">
            <tr>
              <th class="w-[64px] px-2 py-3"><button type="button" class="w-full text-center" @click="sortBy('year')" x-text="t.year + (ascending?' ↑':' ↓')"></button></th>
              <th class="section-end w-[96px] px-2 py-3 text-center" x-text="t.government"></th>
              <template x-for="column in allColumns" :key="column.key">
                <th class="px-2 py-3 text-center font-medium" :class="{'section-end': ['maximum', 'goldMaximum', 'coinMaximum', 'minimumWage'].includes(column.key)}"><span x-text="column.label"></span><small class="block text-[9px] font-normal" x-show="column.key!=='inflation'">(<strong x-show="column.range" x-text="column.range"></strong><span x-text="(column.range ? (lang==='fa'?' به ':' in ') : '') + t.unit"></span>)</small></th>
              </template>
            </tr>
          </thead>
          <tbody class="divide-y divide-line">
            <template x-for="row in sortedRows" :key="row.year">
              <tr class="hover:bg-tint">
                <td class="px-2 py-3 text-center tabular-nums" x-text="formatYear(row.year)"></td>
                <td class="section-end px-2 py-2 text-center"><button type="button" class="portrait-person government-trigger" @click="showGovernment(row)" aria-haspopup="dialog" :aria-label="t.governmentTree+' '+formatYear(row.year)"><img :src="portrait(primaryPerson(row))" :alt="primaryPerson(row)[lang]" width="36" height="36" loading="lazy" /><span class="government-details-arrow" aria-hidden="true">↗</span></button></td>
                <template x-for="column in allColumns" :key="column.key"><td class="px-1 py-3 text-center tabular-nums" :class="{'section-end': ['maximum', 'goldMaximum', 'coinMaximum', 'minimumWage'].includes(column.key)}"><bdi dir="ltr" x-text="allValue(row, column.key)"></bdi></td></template>
              </tr>
            </template>
          </tbody>
        </table>
        <table
          x-show="series!=='all'"
          class="w-full table-fixed border-collapse text-start text-xs sm:text-sm"
          :data-series="series"
        >
          <thead class="sticky top-0 z-10 bg-tint text-muted">
            <tr>
              <template x-for="column in columns" :key="column.key"
                ><th
                  scope="col"
                  :class="column.key==='government'?'w-[16%] lg:w-[12%]':column.key==='year'?'w-[64px] lg:w-[9%]':column.key==='maximum'?'w-[40%] lg:w-[29%]':'w-[30%] lg:w-[26%]'"
                  :aria-sort="column.key==='government'?null:sortKey===column.key?(ascending?'ascending':'descending'):'none'"
                >
                  <span
                    x-show="column.key==='government'"
                    class="block px-2 py-3 text-center font-medium sm:px-4 sm:py-3.5"
                    x-text="t.government"
                  ></span>
                  <button
                    x-show="column.key!=='government'"
                    class="flex w-full items-center justify-center gap-1.5 px-2 py-3 text-center font-medium transition-colors hover:text-ink sm:px-4 sm:py-3.5"
                    @click="sortBy(column.key)"
                    :class="{'category-minimum': column.key==='minimum', 'category-maximum': column.key==='maximum'}"
                  >
                    <span
                      ><span x-text="columnLabel(column.key)"></span
                      ><small
                        x-show="columnHasUnit(column.key)"
                        class="mt-0.5 block text-[9px] font-normal sm:ms-1 sm:inline sm:text-[10px]"
                        x-text="'('+t.unit+')'"
                      ></small></span
                    ><span
                      aria-hidden="true"
                      class="text-[11px]"
                      :class="sortKey===column.key?'opacity-100':'opacity-40'"
                      x-text="sortKey===column.key?(ascending?'↑':'↓'):'↕'"
                    ></span>
                  </button></th
              ></template>
              <th
                scope="colgroup"
                colspan="2"
                class="hidden w-[24%] px-1 py-2 text-center font-medium lg:table-cell sm:px-2"
              >
                <div
                  class="grid grid-cols-[1fr_auto_1fr] items-center gap-1 whitespace-nowrap"
                >
                  <span
                    class="category-minimum text-center text-[8px] sm:text-xs"
                    x-text="t.minimum"
                    >کمترین</span
                  >
                  <div
                    class="flex items-center gap-0.5"
                    dir="ltr"
                    x-show="series!=='wage'"
                  >
                    <input
                      id="dollar-amount"
                      type="text"
                      dir="ltr"
                      inputmode="numeric"
                      min="1"
                      :value="formatPrice(dollarAmount)"
                      @input="updateAmount($event.target.value)"
                      @blur="$event.target.value = formatPrice(dollarAmount)"
                      :aria-label="amountLabel"
                      class="w-[50px] sm:w-[72px] text-center rounded border border-line bg-surface px-1 py-0.5 text-[10px] font-medium text-ink outline-accent sm:text-xs"
                    />
                    <small class="text-[9px] font-normal" x-text="amountUnit"
                      >$</small
                    >
                  </div>
                  <span
                    class="text-[10px] font-medium text-ink sm:text-xs"
                    x-show="series==='wage'"
                    x-text="t.wageInDollars + ' ($)'"
                  ></span>
                  <span
                    class="category-maximum text-center text-[8px] sm:text-xs"
                    x-text="t.maximum"
                    >بیشترین</span
                  >
                </div>
              </th>
            </tr>
          </thead>
          <!-- The build inserts JSON-backed rows for initial rendering and crawlers. -->
          <tbody class="divide-y divide-line" x-init="$el.remove()">
            <!-- STATIC_TABLE_ROWS -->
          </tbody>
          <tbody class="divide-y divide-line">
            <template x-for="(row, index) in sortedRows" :key="row.year"
              ><tr
                class="table-row hover:bg-tint"
                :style="{'--row-delay': Math.min(index, 18) * 28 + 'ms'}"
              >
                <td
                  dir="ltr"
                  class="px-2 py-1.5 text-center text-sm sm:text-base font-medium tabular-nums lg:px-4 sm:py-2"
                >
                  <bdi dir="ltr" x-text="formatYear(row.year)"></bdi>
                </td>
                <td
                  class="px-2 py-1.5 text-[10px] leading-4 text-muted sm:px-4 sm:py-2 sm:text-sm sm:leading-5"
                >
                  <div class="government-portraits">
                    <template x-for="person in [primaryPerson(row)]" :key="person.en">
                      <button
                        type="button"
                        class="portrait-person government-trigger"
                        @click="showGovernment(row)"
                        aria-haspopup="dialog"
                        :aria-label="t.governmentTree + ' ' + formatYear(row.year) + ' — ' + person[lang]"
                        x-data="{
                          open() {
                            const tip = $refs.tooltip;
                            tip.showPopover();
                            const rect = $el.getBoundingClientRect();
                            const width = tip.offsetWidth;
                            const height = tip.offsetHeight;
                            tip.style.left = Math.max(8, Math.min(rect.left + rect.width / 2 - width / 2, window.innerWidth - width - 8)) + 'px';
                            tip.style.top = (rect.top - height - 8 >= 8 ? rect.top - height - 8 : rect.bottom + 8) + 'px';
                          },
                          close() { $refs.tooltip.hidePopover(); }
                        }"
                        @mouseenter="open()"
                        @mouseleave="close()"
                        @focus="open()"
                        @blur="close()"
                        @keydown.escape="close()"
                        @scroll.window.capture="close()"
                        @resize.window="close()"
                      >
                        <img :src="portrait(person)" :alt="person[lang]" width="40" height="40" loading="lazy" decoding="async" />
                        <span class="government-details-arrow" aria-hidden="true">↗</span>
                        <span x-ref="tooltip" popover="manual" class="portrait-tooltip" role="tooltip" :dir="lang==='fa'?'rtl':'ltr'" x-text="person[lang]"></span>
                      </button>
                    </template>

                  </div>

                </td>
                <td
                  dir="ltr"
                  class="px-2 py-1.5 text-center font-medium tabular-nums sm:px-4 sm:py-2"
                >
                  <bdi dir="ltr" x-text="formatCell(row, 'minimum')"></bdi>
                </td>
                <td
                  dir="ltr"
                  class="px-2 py-1.5 text-center text-accent font-medium tabular-nums sm:px-4 sm:py-2"
                >
                  <bdi dir="ltr" x-text="formatCell(row, 'maximum')"></bdi>
                  <span
                    x-show="series!=='wage'"
                    class="ms-1 inline-flex items-baseline whitespace-nowrap text-[10px] sm:text-xs font-normal text-muted"
                    :title="t.multiplier"
                    :aria-label="t.multiplier + ': ' + priceMultiplier(row).replace('×', '↑')"
                  >
                    <span x-text="priceMultiplier(row)==='—'?'—':priceMultiplier(row).split('×')[0]"></span>
                    <span class="text-base sm:text-lg font-medium leading-none" x-show="priceMultiplier(row)!=='—'" aria-hidden="true">↑</span>
                    <span x-show="priceMultiplier(row)!=='—'" aria-hidden="true">)</span>
                  </span>
                </td>
                <td
                  dir="ltr"
                  class="hidden px-0.5 py-1.5 text-center font-medium tabular-nums lg:table-cell sm:text-xs"
                >
                  <bdi dir="ltr" x-text="conversion(row, 'minimum')"></bdi>
                </td>
                <td
                  dir="ltr"
                  class="hidden px-0.5 py-1.5 text-center font-medium tabular-nums lg:table-cell sm:text-xs"
                >
                  <bdi dir="ltr" x-text="conversion(row, 'maximum')"></bdi>
                </td></tr
            ></template>
          </tbody>
        </table>
        <p
          role="status"
          class="px-4 py-5 text-sm text-muted"
          x-show="loading||error"
          x-text="error?t.error:t.loading"
        ></p>
      </div>
      <dialog x-ref="governmentDialog" class="modal-dialog w-[calc(100%-24px)] max-w-4xl rounded-2xl border border-line bg-surface text-ink shadow-xl" aria-labelledby="government-title" @click.self="$refs.governmentDialog.close()">
        <div class="p-3 sm:p-4" :dir="lang==='fa'?'rtl':'ltr'">
          <header class="flex items-center justify-between gap-4">
            <h2 id="government-title" class="text-lg font-semibold" x-text="t.governmentTree + ' ' + formatYear(governmentYear)"></h2>
            <button type="button" class="icon-button" @click="$refs.governmentDialog.close()" :aria-label="t.close" autofocus>✕</button>
          </header>
          <p class="mt-2 text-[9px] leading-4 text-muted" x-text="t.officeholdersNote"></p>
          <p class="mt-2 hidden text-[10px] text-muted md:block" x-text="t.personHint"></p>
          <div class="mt-3 grid items-start gap-3 md:grid-cols-[220px_minmax(0,1fr)]" dir="ltr">
            <aside class="hidden rounded-xl border border-line bg-tint p-4 md:block md:sticky md:top-4" :dir="lang==='fa'?'rtl':'ltr'" aria-live="polite">
              <template x-if="selectedGovernmentPerson">
                <div>
                  <template x-if="portrait(selectedGovernmentPerson)"><img class="mb-3 h-14 w-14 rounded-full border border-line" :src="portrait(selectedGovernmentPerson)" :alt="selectedGovernmentPerson[lang]" width="56" height="56" /></template>
                  <h3 class="text-base font-semibold" x-text="selectedGovernmentPerson[lang]"></h3>
                  <p class="mt-2 text-xs leading-5 text-accent" x-text="selectedPersonRole"></p>
                  <h4 class="mt-5 text-[10px] font-medium text-muted" x-text="t.termsAndSources"></h4>
                  <p class="mt-2 text-xs leading-6" x-text="formatTermDate(selectedGovernmentPerson.start) + ' — ' + formatTermDate(selectedGovernmentPerson.end)"></p>
                  <a class="source-link mt-3 inline-block text-xs" :href="selectedGovernmentPerson.source" target="_blank" rel="noopener" x-text="t.historicalSource + ' ↗'"></a>
                </div>
              </template>
            </aside>
            <div class="order-1 md:order-2" :dir="lang==='fa'?'rtl':'ltr'">
              <section>
                <h3 class="border-b border-line pb-2 text-sm font-semibold text-accent" x-text="t.cabinet"></h3>
                <ul class="divide-y divide-line">
                  <template x-for="node in [...governmentLeaders.filter(node => node.role!=='معاون اول'), ...governmentMinisters]" :key="node.role">
                    <li>
                      <template x-for="person in node.members" :key="person.en">
                        <button type="button" class="grid w-full grid-cols-[minmax(0,1fr)_minmax(0,1.2fr)] items-center gap-3 rounded px-2 py-2 text-start transition-colors hover:bg-tint focus-visible:outline-accent" :class="selectedGovernmentPerson?.en===person.en&amp;&amp;selectedGovernmentPerson?.role===person.role?'md:bg-tint md:text-accent':'text-ink'" :aria-pressed="selectedGovernmentPerson?.en===person.en&amp;&amp;selectedGovernmentPerson?.role===person.role" @click="if (window.matchMedia('(min-width: 768px)').matches) selectGovernmentPerson(person)">
                          <span class="text-xs leading-4" x-text="person[lang]"></span>
                          <span class="text-[10px] leading-4 text-muted" x-text="node.label"></span>
                        </button>
                      </template>
                    </li>
                  </template>
                </ul>
              </section>
              <section class="mt-5">
                <h3 class="border-b border-line pb-2 text-sm font-semibold text-accent" x-text="t.centralBank"></h3>
                <ul class="divide-y divide-line">
                  <template x-for="node in centralBankTree ? [centralBankTree] : []" :key="node.role">
                    <li>
                      <template x-for="person in node.members" :key="person.en">
                        <button type="button" class="grid w-full grid-cols-[minmax(0,1fr)_minmax(0,1.2fr)] items-center gap-3 rounded px-2 py-2 text-start transition-colors hover:bg-tint focus-visible:outline-accent" :class="selectedGovernmentPerson?.en===person.en&amp;&amp;selectedGovernmentPerson?.role===person.role?'md:bg-tint md:text-accent':'text-ink'" :aria-pressed="selectedGovernmentPerson?.en===person.en&amp;&amp;selectedGovernmentPerson?.role===person.role" @click="if (window.matchMedia('(min-width: 768px)').matches) selectGovernmentPerson(person)">
                          <span class="text-xs leading-4" x-text="person[lang]"></span>
                          <span class="text-[10px] leading-4 text-muted" x-text="node.label"></span>
                        </button>
                      </template>
                    </li>
                  </template>
                </ul>
              </section>
            </div>
          </div>
          <template x-if="governmentEvent">
            <details class="mt-5 border-t border-line pt-4">
              <summary class="cursor-pointer text-sm font-medium text-accent" x-text="t.yearEvents"></summary>
              <p class="mt-2 text-xs leading-6" x-text="governmentEvent[lang]"></p>
              <p class="mt-2 text-[10px] text-muted" x-text="t.portraitRule"></p>
              <a class="source-link text-[10px]" :href="governmentEvent.source" target="_blank" rel="noopener" x-text="t.historicalSource + ' ↗'"></a>
              <template x-if="governmentEvent.electionSource">
                <a class="source-link ms-3 text-[10px]" :href="governmentEvent.electionSource" target="_blank" rel="noopener" x-text="t.historicalSource + ' ↗'"></a>
              </template>
              <h4 class="mt-4 text-xs font-medium" x-text="t.otherLeaders"></h4>
              <template x-for="node in governmentLeaders" :key="node.role">
                <div class="mt-2 text-xs"><p class="text-muted" x-text="node.label"></p><p x-text="node.members.map(person => person[lang]).join(lang==='fa'?'، ':', ')"></p></div>
              </template>
            </details>
          </template>
        </div>
      </dialog>
      <dialog x-ref="creditsDialog" class="modal-dialog w-[calc(100%-24px)] max-w-lg rounded-2xl border border-line bg-surface text-ink shadow-xl" aria-labelledby="credits-title" @click.self="$refs.creditsDialog.close()" @close="$el.querySelectorAll('details').forEach(section => section.open = false)">
        <div class="p-4 sm:p-6" :dir="lang==='fa'?'rtl':'ltr'">
          <header class="flex items-center justify-between gap-4">
            <h2 id="credits-title" class="text-lg font-semibold" x-text="t.sourcesUsed"></h2>
            <button type="button" class="icon-button" @click="$refs.creditsDialog.close()" :aria-label="t.close" autofocus>✕</button>
          </header>
          <details class="mt-4">
            <summary class="cursor-pointer text-sm font-medium text-accent" x-text="t.priceSources"></summary>
            <ul class="mt-2 space-y-2">
              <template x-for="source in dataSources" :key="source.url"><li><a class="source-link text-xs" :href="source.url" target="_blank" rel="noopener" x-text="source.name"></a></li></template>
            </ul>
          </details>
          <details class="mt-4 border-t border-line pt-3">
            <summary class="cursor-pointer text-sm font-medium text-accent" x-text="t.governmentSources"></summary>
            <ul class="mt-2 space-y-2"><template x-for="url in governmentSources" :key="url"><li><a class="source-link block break-words text-xs" :href="url" target="_blank" rel="noopener" x-text="decodeURIComponent(new URL(url).pathname.split('/').filter(Boolean).at(-1)).replaceAll('_',' ')"></a></li></template></ul>
          </details>
          <details class="mt-4 border-t border-line pt-3">
            <summary class="cursor-pointer text-sm font-medium text-accent" x-text="t.imageSources"></summary>
          <p class="mt-3 text-xs leading-6 text-muted" x-text="t.imageNote"></p>
          <ul class="mt-4 divide-y divide-line">
            <template x-for="credit in portraitCredits" :key="credit.en">
              <li class="py-3">
                <a class="source-link text-sm" :href="credit.source" target="_blank" rel="noopener" x-text="credit[lang] + ' ↗'"></a>
                <p class="mt-1 text-[10px] text-muted"><span x-text="!credit.artist||credit.artist.startsWith('Unknown author')?t.unknownAuthor:credit.artist"></span> · <a :href="credit.licenseUrl||credit.source" target="_blank" rel="noopener" x-text="credit.license==='Public domain'?t.publicDomain:credit.license"></a></p>
              </li>
            </template>
          </ul>
          </details>
        </div>
      </dialog>
      <dialog id="aboutDialog" x-ref="aboutDialog" class="modal-dialog w-[calc(100%-24px)] max-w-lg rounded-2xl border border-line bg-surface text-ink shadow-xl" aria-labelledby="about-title" @click.self="$refs.aboutDialog.close()">
        <div class="p-4 sm:p-6" :dir="lang==='fa'?'rtl':'ltr'">
          <header class="flex items-center justify-between gap-4">
            <h2 id="about-title" class="text-lg font-semibold" x-text="t.whySite"></h2>
            <button type="button" class="icon-button" @click="$refs.aboutDialog.close()" :aria-label="t.close" autofocus>✕</button>
          </header>
          <p class="mt-4 text-sm leading-7 text-muted" x-text="t.introduction"></p>
          <h3 class="mt-5 text-sm font-semibold" x-text="t.siteFeatures"></h3>
          <ul class="mt-3 list-disc space-y-2 ps-5 text-xs leading-6 text-muted">
            <template x-for="key in ['featurePrices', 'featureWages', 'featureConversion', 'featureSorting', 'featureGovernment']" :key="key">
              <li x-text="t[key]"></li>
            </template>
          </ul>
        </div>
      </dialog>
      <dialog id="readThisDialog" x-ref="readThisDialog" class="modal-dialog w-[calc(100%-24px)] max-w-lg rounded-2xl border border-line bg-surface text-ink shadow-xl" aria-labelledby="read-this-title" @click.self="$refs.readThisDialog.close()" @close="acknowledgeReadThis()">
        <div class="p-4 sm:p-6" :dir="lang==='fa'?'rtl':'ltr'">
          <header class="flex items-center justify-between gap-4">
            <h2 id="read-this-title" class="text-lg font-semibold" x-text="t.readThis"></h2>
            <button type="button" class="icon-button" @click="$refs.readThisDialog.close()" :aria-label="t.close" autofocus>✕</button>
          </header>
          <p class="mt-4 text-sm leading-7 text-muted" x-text="t.publicDataNote"></p>
          <p class="mt-4 text-sm leading-7 text-muted" x-text="t.usageResponsibility"></p>
          <p class="mt-4 text-sm leading-7 text-muted" x-text="t.contactNote"></p>
          <p class="text-left text-sm leading-7 text-muted" dir="ltr">ohmydevops [at] gmail [dot] com</p>
          <button type="button" class="mt-5 w-full rounded-lg border border-line bg-tint px-4 py-2 text-sm font-medium text-accent hover:bg-surface" @click="$refs.readThisDialog.close()" x-text="t.understand"></button>
        </div>
      </dialog>
      <dialog id="explorerDialog" x-ref="explorerDialog" class="modal-dialog w-[calc(100%-24px)] max-w-md rounded-2xl border border-line bg-surface text-ink shadow-xl" aria-labelledby="explorer-title" @click.self="$refs.explorerDialog.close()">
        <div class="p-4 sm:p-6" :dir="lang==='fa'?'rtl':'ltr'">
          <header class="flex items-center justify-between gap-4">
            <h2 id="explorer-title" class="text-lg font-semibold" x-text="t.explorer"></h2>
            <button type="button" class="icon-button" @click="$refs.explorerDialog.close()" :aria-label="t.close">✕</button>
          </header>
          <div class="lookup-fields mt-4 grid grid-cols-[minmax(0,1fr)_minmax(0,1fr)] items-end gap-2 sm:gap-3">
            <label class="lookup-asset text-xs text-muted" for="explorer-series"><span x-text="t.series"></span><select id="explorer-series" x-model="explorerSeries" class="mt-2 block max-w-[140px] rounded-lg border border-line bg-surface px-3 py-2 text-sm text-ink"><option value="dollar" x-text="t.lookupDollar"></option><option value="gold" x-text="t.lookupGold"></option><option value="coin" x-text="t.lookupCoin"></option></select></label>
            <label class="text-xs text-muted" for="explorer-price"><span x-text="t.lookupPrice"></span><input id="explorer-price" type="text" inputmode="numeric" :value="explorerPriceDisplay" @input="updateExplorerPrice($event.target.value); $event.target.value=explorerPriceDisplay" :placeholder="t.lookupHint" :dir="lang==='fa'?'rtl':'ltr'" class="mt-2 block w-full rounded-lg border border-line bg-surface px-3 py-2 text-sm text-ink" autofocus /></label>
          </div>
          <div class="explorer-results mt-4" aria-live="polite" tabindex="0">
            <p class="text-sm text-muted" x-show="!data" x-text="error?t.error:t.explorerLoading"></p>
            <p class="text-sm text-muted" x-show="data && !explorerPrice" x-text="t.lookupEmpty"></p>
            <p class="text-sm text-muted" x-show="data && explorerPrice && !explorerMatches.length" x-text="t.lookupNoMatch"></p>
            <ul class="divide-y divide-line">
              <template x-for="row in explorerMatches" :key="row.year"><li class="py-3"><p class="font-semibold text-accent" x-text="t.year+' '+formatYear(row.year)"></p><p class="mt-1 text-xs leading-6 text-muted" x-text="t.government+': '+governmentName(row)"></p></li></template>
            </ul>
          </div>
          <p class="mt-4 border-t border-line pt-3 text-[11px] leading-5 text-muted" x-text="t.lookupNote"></p>
        </div>
      </dialog>
      <dialog x-ref="mobileFeaturesDialog" class="modal-dialog w-[calc(100%-24px)] max-w-sm rounded-2xl border border-line bg-surface text-ink shadow-xl" aria-labelledby="mobile-features-title" @close="onMobileFeaturesClosed()">
        <div class="p-5" :dir="lang==='fa'?'rtl':'ltr'">
          <h2 id="mobile-features-title" class="text-base font-semibold" x-text="t.desktopFeaturesTitle"></h2>
          <p class="mt-3 text-sm leading-7 text-muted" x-text="t.desktopFeaturesNote"></p>
          <button type="button" class="mt-5 w-full rounded-lg border border-line bg-tint px-4 py-2 text-sm font-medium text-accent hover:bg-surface" @click="acknowledgeMobileFeatures()" x-text="t.understand" autofocus></button>
        </div>
      </dialog>
      <footer class="site-footer mt-4 flex shrink-0 items-center justify-between gap-3 border-t border-line pt-3 text-[10px] text-muted" dir="ltr">
        <p class="hidden min-w-0 flex-wrap items-center gap-1 sm:flex" :dir="lang==='fa'?'rtl':'ltr'">
          <span class="text-[11px] leading-none" aria-hidden="true">❤️</span>
          <span x-text="t.createdWith">ساخته شده با علاقه و درد توسط</span>
          <a class="source-link" href="https://github.com/ohmydevops/USDTOMAN" target="_blank" rel="noopener">ohmydevops</a>
          <span x-text="t.createdWhen">در یک بعدازظهر مهر ۱۴۰۵</span>
        </p>
        <nav class="ml-auto flex shrink-0 flex-wrap justify-end gap-x-3 gap-y-1" :dir="lang==='fa'?'rtl':'ltr'">
          <button type="button" class="source-link py-1" @click="showAbout()" aria-haspopup="dialog" aria-controls="aboutDialog" x-text="t.whySite">چرا این سایت؟</button>
          <button type="button" class="source-link py-1" @click="$refs.creditsDialog.showModal()" aria-haspopup="dialog" x-text="t.sourcesUsed">منابع استفاده شده</button>
          <button type="button" class="source-link py-1" @click="showReadThis()" aria-haspopup="dialog" aria-controls="readThisDialog" x-text="t.readThis">لطفاً این را بخوانید</button>
        </nav>
      </footer>
    </main>
  </body>
</html>
